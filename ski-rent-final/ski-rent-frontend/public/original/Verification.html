<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Verification</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <div class="bg-wrap" aria-hidden="true">
    <canvas id="bgCanvas"></canvas>
  </div>

  <div class="left">
    <div class="logo">
    </div>

    <div class="form">
    <h2>Введите код подтверждения</h2>
    <form onsubmit="redirectToDashboard(event)">
        <label for="code">Мы отправили код на вашу почту</label>
    <div class="code-inputs">
      <input maxlength="1" class="code-field" type="text">
      <input maxlength="1" class="code-field" type="text">
      <input maxlength="1" class="code-field" type="text">
      <input maxlength="1" class="code-field" type="text">
      <input maxlength="1" class="code-field" type="text">
      <input maxlength="1" class="code-field" type="text">
    </div>

      <button type="submit" class="btn">Continue</button>
    </form>
    <a href="Password.html">
        <button class="social-btn">Go back</button>
    </a>
  </div>

    <div class="info">
      <span>Please review the site,</span>
      <button class="info-btn">Terms & Documents</button>
    </div>
  </div>
  <div class="right"></div>

  <script>
    const inputs = document.querySelectorAll(".code-field");
    inputs.forEach((input, index) => {
      input.addEventListener("input", () => {
        if (input.value && index < inputs.length - 1) {
          inputs[index + 1].focus();
        }
      });
    });
  </script>
</body>
</html>
